# PlacidWay Social Autopilot: local stack
#   postgres  : n8n metadata (db "n8n") + pipeline store (db "pw")
#   n8n       : the workflows (editor at http://localhost:5678)
#   dashboard : nginx serving the review dashboard + /media, proxying /api to n8n webhooks
# The LLM bridge runs on the host (npm run bridge) so it can use your Claude CLI login.

name: placidway-autopilot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pw_local_dev}
      POSTGRES_DB: n8n
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pw} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:2.44.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-pw}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-pw_local_dev}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Workflows read their (non-secret) wiring from env: bridge URL, page id, graph version...
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_SECURE_COOKIE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./media:/files/media
      - ./workflows:/seed/workflows:ro
      - ./db/seed:/seed/credentials:ro

  dashboard:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      PW_API_TOKEN: ${PW_API_TOKEN}
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./media:/srv/media:ro
      - ./dashboard/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
  n8ndata:
